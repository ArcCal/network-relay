# Tests every push to main, and builds the program for Linux on arm64 and
# x86_64. For a published GitHub Release, the builds are attached to it.
#
# Built on Ubuntu 22.04, so the program runs on Ubuntu 22.04, Debian 12 and
# later. arm64 is cross-compiled, and its tests run under qemu.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release to build and attach the program to (empty: build main only)"
        required: false
        default: ""

permissions:
  contents: read

# Actions are pinned to commit SHAs (a tag can be moved to other code); the
# comment names the tag each one was taken from. Cargo uses the committed
# Cargo.lock exactly (--locked).

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
  # Tests that start the binary as a child process run it through binfmt,
  # which needs the same sysroot as the runner above.
  QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
  CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
  AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

jobs:
  test:
    name: lint and test (x86_64)
    if: inputs.tag == ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: bash -n deploy/install-debian13.sh
      - run: python3 -m unittest discover -s tests -p 'test_deploy.py' -v

  build:
    name: build ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-unknown-linux-gnu, arch: arm64 }
          - { target: x86_64-unknown-linux-gnu, arch: x86_64 }
    env:
      CARGO_PROFILE_RELEASE_STRIP: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Cross compiler and qemu
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - name: Test (arm64 runs under qemu)
        run: cargo test --locked --release --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --bins --target ${{ matrix.target }}
      - name: Package
        id: package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name=network-relay-$version-linux-${{ matrix.arch }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/network-relay dist/$name/
          cp -r deploy README.md CHANGELOG.md dist/$name/
          tar -czf dist/$name.tar.gz -C dist $name
          (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 30

  release:
    name: attach to the release
    if: github.event_name == 'release' || inputs.tag != ''
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
