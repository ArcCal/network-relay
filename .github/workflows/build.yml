# Tests pull requests and pushes to main. Release and manual runs build
# every binary package: the server and the headless Network Relay RS client
# for Linux arm64 and x86_64, and the Network Relay RS and NF macOS apps
# plus the RS command-line client for macOS arm64. Published Releases (and
# manual runs given a release tag) receive all of them and the installers.
#
# Linux packages are built on Ubuntu 22.04, so they run on Ubuntu 22.04,
# Debian 12 and later. arm64 is cross-compiled, and its tests run under qemu.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release to build and attach the program to (empty: build main only)"
        required: false
        default: ""

permissions:
  contents: read

# Actions are pinned to commit SHAs (a tag can be moved to other code); the
# comment names the tag each one was taken from. Cargo uses the committed
# Cargo.lock exactly (--locked).

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
  # Tests that start the binary as a child process run it through binfmt,
  # which needs the same sysroot as the runner above.
  QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
  CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
  AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

jobs:
  test:
    name: lint and test (x86_64)
    if: inputs.tag == ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Integration tests with every tunnel through an egress
        run: NETWORK_RELAY_TEST_EGRESS=loopback cargo test --locked --test in_process
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: bash -n deploy/install-debian13.sh
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tools/tests -v
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: tests/interop/masque-go/go.sum
      - name: Independent quic-go, masque-go and curl interoperability
        timeout-minutes: 5
        run: |
          cargo build --locked
          test -z "$(gofmt -l tests/interop/masque-go/main.go)"
          (cd tests/interop/masque-go && go vet ./...)
          python3 tests/interop/run.py
      - name: Vendored HTTP/3 tests (including current h3-quinn source)
        timeout-minutes: 5
        run: |
          suite=$(mktemp -d)
          trap 'rm -rf "$suite"' EXIT
          cp -R vendor/h3 vendor/h3-quinn "$suite/"
          cargo test --manifest-path "$suite/h3/Cargo.toml" --all-features \
            --config "patch.\"https://github.com/hyperium/h3\".h3.path=\"$suite/h3\""

  build:
    name: build ${{ matrix.arch }}
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-unknown-linux-gnu, arch: arm64 }
          - { target: x86_64-unknown-linux-gnu, arch: x86_64 }
    env:
      CARGO_PROFILE_RELEASE_STRIP: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Cross compiler and qemu
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - name: Test (arm64 runs under qemu)
        run: cargo test --locked --release --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --bins --target ${{ matrix.target }}
      - name: Package
        id: package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name=network-relay-$version-linux-${{ matrix.arch }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/network-relay dist/$name/
          cp -r deploy README.md CHANGELOG.md dist/$name/
          tar -czf dist/$name.tar.gz -C dist $name
          (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # The headless Network Relay RS client is its own Cargo workspace.
      - name: Test Network Relay RS client (arm64 runs under qemu)
        run: cargo test --locked --release --manifest-path network-relay-rs/Cargo.toml -p network-relay-rs -p network-relay-rs-core --target ${{ matrix.target }}
      - name: Build Network Relay RS client
        run: |
          APP_SOURCE_REVISION=$(git rev-parse HEAD) APP_BUILD_TIME=$(date -u +%FT%TZ) \
            cargo build --locked --release --manifest-path network-relay-rs/Cargo.toml --bin network-relay-rs --target ${{ matrix.target }}
      - name: Package Network Relay RS client
        run: |
          version=$(tr -d '[:space:]' < network-relay-rs/VERSION)
          name="network-relay-rs-$version-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp "network-relay-rs/target/${{ matrix.target }}/release/network-relay-rs" "dist/$name/"
          cp network-relay-rs/README.md network-relay-rs/NOTICE.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 30

  # The macOS applications are built by their own scripts, which also run
  # their tests. Both target macOS 27 and run on the GitHub-hosted macOS 27
  # image with Xcode 27 (currently a public preview). Each job attaches its
  # own files, so a missing macOS runner never holds back the Linux packages.
  macos-rs:
    name: build Network Relay RS (macOS arm64)
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Build the app and command-line client
        env:
          NETWORK_RELAY_TOKEN: ${{ github.token }}
          RELAY_CI_APP: rs
        # Keep release/tag identity while public build scripts fetch main.
        run: &fresh_macos_build |
          set +x
          expected=$(git rev-parse HEAD)
          stage=$(mktemp -d "/tmp/network-relay-ci-$(date +%Y%m%d-%H%M%S).XXXXXX")
          cleanup() {
            local status=$?
            trap - EXIT
            if declare -F relay_remove_build_work >/dev/null; then
              relay_remove_build_work "$stage"
            else
              find -P "$stage" -type d -exec chmod u+w {} + 2>/dev/null || true
              rm -rf -- "$stage"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # Git receives credentials through its environment, never argv/config.
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0=''
          export GIT_CONFIG_KEY_1=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_1
          GIT_CONFIG_VALUE_1="Authorization: Basic $(printf 'x-access-token:%s' "$NETWORK_RELAY_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_KEY_2=protocol.file.allow GIT_CONFIG_VALUE_2=never
          fresh="$stage/source"
          git clone --no-checkout -- "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$fresh"
          git -C "$fresh" fetch origin "$expected"
          git -C "$fresh" checkout --detach "$expected"
          test "$(git -C "$fresh" rev-parse HEAD)" = "$expected"
          git -C "$fresh" submodule update --init --recursive
          unset NETWORK_RELAY_TOKEN GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1 GIT_CONFIG_KEY_2 GIT_CONFIG_VALUE_2
          runner="$fresh/tools/run-build-child.sh"
          if [[ ! -f $runner ]]; then
            # Historical tags still use the current source owner's supervisor.
            runner="$stage/run-build-child.sh"
            git -C "$fresh" show refs/remotes/origin/main:tools/run-build-child.sh > "$runner"
          fi
          # shellcheck source=/dev/null
          source "$runner"
          export RELAY_BUILD_WORK_ROOT="$stage/work"
          mkdir -p "$RELAY_BUILD_WORK_ROOT"
          if [[ -f $fresh/tools/fresh-build-source.sh ]]; then
            # shellcheck source=/dev/null
            source "$fresh/tools/fresh-build-source.sh"
            relay_mark_fresh_source "$fresh"
            export RELAY_BUILD_OUTPUT_ROOT="$GITHUB_WORKSPACE"
          else
            # Historical tags predate the shared bootstrap. Their sources and
            # new toolchain/caches must still remain inside this owned run.
            export CARGO_HOME="$stage/work/cargo" RUSTUP_HOME="$stage/work/rustup"
            export CARGO_TARGET_DIR="$stage/work/target" RUSTUP_TOOLCHAIN=stable
            export TMPDIR="$stage/work/tmp" XDG_CACHE_HOME="$stage/work/cache"
            export CLANG_MODULE_CACHE_PATH="$stage/work/clang-cache"
            export SWIFTPM_MODULECACHE_OVERRIDE="$stage/work/swift-module-cache"
            export RELAY_CI_SWIFT
            RELAY_CI_SWIFT=$(command -v swift)
            mkdir -p "$TMPDIR" "$stage/work/bin"
            cat > "$stage/work/bin/swift" <<'SWIFT'
          #!/usr/bin/env bash
          case ${1:-} in
            build|test|resolve)
              subcommand=$1; shift
              exec "$RELAY_CI_SWIFT" "$subcommand" \
                --cache-path "$RELAY_BUILD_WORK_ROOT/swift-cache" \
                --config-path "$RELAY_BUILD_WORK_ROOT/swift-config" \
                --security-path "$RELAY_BUILD_WORK_ROOT/swift-security" "$@" ;;
            *) exec "$RELAY_CI_SWIFT" "$@" ;;
          esac
          SWIFT
            chmod 755 "$stage/work/bin/swift"
            export PATH="$stage/work/bin:$PATH"
            relay_run_build_child rustup toolchain install stable --profile minimal --target aarch64-apple-darwin
          fi
          project="network-relay-$RELAY_CI_APP"
          relay_run_build_child bash "$fresh/$project/build-macos.sh"
          # Older scripts write their final products inside their source tree.
          if [[ -d $fresh/$project/dist ]]; then
            mkdir -p "$GITHUB_WORKSPACE/$project/dist"
            cp -R "$fresh/$project/dist/." "$GITHUB_WORKSPACE/$project/dist/"
          fi
          legacy_cli="$fresh/$project/build/target/aarch64-apple-darwin/release/network-relay-rs"
          if [[ $RELAY_CI_APP == rs && -f $legacy_cli ]]; then
            install -m 755 "$legacy_cli" "$GITHUB_WORKSPACE/$project/dist/network-relay-rs"
          fi
      - name: Package
        run: |
          version=$(tr -d '[:space:]' < network-relay-rs/VERSION)
          name="network-relay-rs-$version-macos-arm64"
          mkdir -p "dist/$name"
          cp network-relay-rs/dist/network-relay-rs "dist/$name/"
          codesign --force --sign - "dist/$name/network-relay-rs"
          codesign --verify --strict "dist/$name/network-relay-rs"
          "dist/$name/network-relay-rs" --version
          cp network-relay-rs/README.md network-relay-rs/NOTICE.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          cp "network-relay-rs/dist/NetworkRelayRS-$version-macos-arm64.zip" "network-relay-rs/dist/NetworkRelayRS-$version-macos-arm64.zip.sha256" dist/
          rm -rf "dist/${name:?}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: network-relay-rs-macos-arm64
          path: dist/*
          retention-days: 30
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  macos-nf:
    name: build Network Relay NF (macOS arm64)
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    # Network Relay NF requires macOS 27 and the Xcode 27 SDK.
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Build the app
        env:
          NETWORK_RELAY_TOKEN: ${{ github.token }}
          RELAY_CI_APP: nf
        run: *fresh_macos_build
      - name: Package
        run: |
          version=$(tr -d '[:space:]' < network-relay-nf/VERSION)
          mkdir -p dist
          cp "network-relay-nf/dist/NetworkRelayNF-$version-macos-arm64.zip" "network-relay-nf/dist/NetworkRelayNF-$version-macos-arm64.zip.sha256" dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: network-relay-nf-macos-arm64
          path: dist/*
          retention-days: 30
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  release:
    name: attach to the release
    if: github.event_name == 'release' || inputs.tag != ''
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: network-relay-*-linux-*
          merge-multiple: true
      - name: Verify and package standalone installers
        run: |
          python3 deploy/package-installer.py --out dist/network-relay-install.sh
          python3 deploy/package-installer.py --source --out dist/network-relay-install-from-source.sh
          cmp network-relay-install.sh dist/network-relay-install.sh
          cmp network-relay-install-from-source.sh dist/network-relay-install-from-source.sh
          bash -n dist/network-relay-install.sh
          bash -n dist/network-relay-install-from-source.sh
          bash dist/network-relay-install.sh --help
          bash dist/network-relay-install-from-source.sh --help
          (cd dist && sha256sum -c network-relay-install.sh.sha256 -c network-relay-install-from-source.sh.sha256)
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
