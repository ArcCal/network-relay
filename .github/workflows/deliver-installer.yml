name: deliver prebuilt VPS installer
on:
  push:
    branches: [codex/prebuilt-vps-installer]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-22.04
    steps:
      - name: Attach the tested standalone installer to release 1.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          printf '%s' '' | base64 --decode > dist/network-relay-install.sh
          bash -n dist/network-relay-install.sh
          bash dist/network-relay-install.sh --help
          (cd dist && sha256sum network-relay-install.sh > network-relay-install.sh.sha256)
          gh release upload 1.4 dist/network-relay-install.sh dist/network-relay-install.sh.sha256 --repo "$GITHUB_REPOSITORY"
