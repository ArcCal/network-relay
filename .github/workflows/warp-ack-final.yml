name: Validate receive acknowledgments, transfer costs and sustained WARP traffic
'on':
  push:
    branches:
    - audit/warp-delayed-ack-validation-20261120
permissions:
  contents: read
jobs:
  soak:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 125
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04
        - ubuntu-22.04-arm
        variant:
        - ack
        - ack-batch
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
        fetch-depth: 2
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
      with:
        toolchain: stable
    - name: Run finite controls and verify sustained authenticated traffic through
        both transports
      shell: bash
      env:
        CARGO_PROFILE_TEST_DEBUG: '0'
        CARGO_PROFILE_DEV_DEBUG: '0'
        CARGO_INCREMENTAL: '0'
        SOAK_SECONDS: '3900'
        STUDY: ${{ matrix.variant }}
      run: 'set -euo pipefail

        python3 diagnostics/warp-acks/configure.py "$STUDY"

        cd network-relay-cf-masque

        python3 scripts/verify-smoltcp.py --test

        bash scripts/soak.sh

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ack-soak-${{ matrix.variant }}-${{ matrix.runner }}
        path: 'network-relay-cf-masque/target/evidence/soak-*.json

          network-relay-cf-masque/target/evidence/soak-*.jsonl

          network-relay-cf-masque/target/evidence/*independent*.json

          '
        retention-days: 7
  transfer:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04
        - ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
        fetch-depth: 2
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
      with:
        toolchain: stable
    - name: Time complete transfers with direct channels and a controlled two-way
        delay
      shell: bash
      run: "set -euo pipefail\nmkdir \"$RUNNER_TEMP/evidence\"\nexport CARGO_TARGET_DIR=\"\
        $RUNNER_TEMP/target\"\nfor v in prior ack batch ack-batch; do\n  python3 diagnostics/warp-acks/configure.py\
        \ \"$v\"\n  cargo build --release --locked --manifest-path diagnostics/performance/Cargo.toml\
        \ --bin path --bin fast\n  cp \"$CARGO_TARGET_DIR/release/path\" \"$RUNNER_TEMP/$v-delay\"\
        \n  cp \"$CARGO_TARGET_DIR/release/fast\" \"$RUNNER_TEMP/$v-fast\"\ndone\n\
        for round in 0 1 2 3 4 5 6 7; do\n  case $((round % 4)) in\n    0) seq=\"\
        prior ack batch ack-batch\";;\n    1) seq=\"ack-batch batch ack prior\";;\n\
        \    2) seq=\"batch prior ack-batch ack\";;\n    3) seq=\"ack ack-batch prior\
        \ batch\";;\n  esac\n  for v in $seq; do\n    RELAY_STACK_STUDY=\"$v\" /usr/bin/time\
        \ -a -o \"$RUNNER_TEMP/evidence/cpu.txt\" -f \"$round 0 $v %U %S %M\" \"$RUNNER_TEMP/$v-fast\"\
        \ 0 \"$round\" >> \"$RUNNER_TEMP/evidence/paths.jsonl\"\n    if (( round <\
        \ 3 )); then\n      for rtt in 50 100; do\n        RELAY_STACK_STUDY=\"$v\"\
        \ /usr/bin/time -a -o \"$RUNNER_TEMP/evidence/cpu.txt\" -f \"$round $rtt $v\
        \ %U %S %M\" \"$RUNNER_TEMP/$v-delay\" \"$rtt\" \"$round\" >> \"$RUNNER_TEMP/evidence/paths.jsonl\"\
        \n      done\n    fi\n  done\ndone\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ack-transfers-${{ matrix.runner }}
        path: ${{ runner.temp }}/evidence
        retention-days: 7
