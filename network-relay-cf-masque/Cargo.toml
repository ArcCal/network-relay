[workspace]
resolver = "2"
members = ["crates/warp-egress"]

[package]
name = "network-relay-cf-masque"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experimental Network Relay server with mandatory Cloudflare WARP MASQUE egress"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The relay itself: the server, its configuration and its helper commands.
network-relay = { path = ".." }
warp-masque-egress = { path = "crates/warp-egress" }
toml = "0.9"
tracing = "0.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
warp-masque-egress = { path = "crates/warp-egress", features = ["test-support"] }
base64 = "0.22"
h2 = "0.4"
http = "1"
h3 = { git = "https://github.com/hyperium/h3", rev = "43745ad87e95b0c035ac9c547aad467303213425" }
h3-quinn = { git = "https://github.com/hyperium/h3", rev = "43745ad87e95b0c035ac9c547aad467303213425", features = ["datagram"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
x509-parser = "0.18"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
rcgen = "0.14"
sha2 = "0.10"

# network-relay's vendored h3, as network-relay itself uses it.
[patch."https://github.com/hyperium/h3"]
h3 = { path = "../vendor/h3" }
h3-quinn = { path = "../vendor/h3-quinn" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
