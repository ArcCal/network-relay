[package]
name = "warp-masque-egress"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "Reusable, userspace Cloudflare WARP MASQUE TCP, UDP and DNS egress"
license = "MIT"

[features]
test-support = []

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
h2 = "0.4"
http = "1"
h3 = { path = "../../vendor/h3" }
h3-quinn = { path = "../../vendor/h3-quinn" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
quinn-proto = { version = "0.11", default-features = false }
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smoltcp = { version = "0.14", default-features = false, features = ["std", "async", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-tcp-cubic", "assembler-max-segment-count-32"] }
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
toml = "0.9"
tracing = "0.1"
x509-parser = "0.18"

[dev-dependencies]
rand = "0.9"
tokio = { version = "1", features = ["test-util"] }
