# Same configuration schema and credentials as the standard Network Relay.
listen = "127.0.0.1:8443"
[tls]
cert = "examples/tls/fullchain.pem"
key = "examples/tls/privkey.pem"
[web]
root = "examples/site"
[relay]
udp_template = "/.well-known/masque/udp/{target_host}/{target_port}/"
# Reserve userspace sockets for DNS and connecting/closing TCP flows.
max_tunnels = 48
max_tunnels_per_user = 32
# Defaults retain destination/port restrictions. Do not disable them for production.
connect_timeout_secs = 10
udp_idle_timeout_secs = 300
[debug]
log_requests = false
# Append existing [[user]] entries, or use the app's passwd helper.
