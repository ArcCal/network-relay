[warp]
# WARP-only alternative for diagnostics/reuse. serve reads [warp] from relay.toml;
# it does not require this second file. Replace the enrolled values below.
transport = "h3"
# There is no automatic fallback to HTTP/2 or direct egress.
# Optional numeric endpoint override; otherwise use the enrolled endpoint_v4.
# endpoint = "162.159.198.2:443"

[warp.registration]
private_key = "REPLACE_WITH_ENROLLED_BASE64_P256_PKCS8_PRIVATE_KEY"
endpoint_public_key = """-----BEGIN PUBLIC KEY-----
REPLACE_WITH_ENROLLED_PUBLIC_KEY_BASE64
-----END PUBLIC KEY-----
"""
tunnel_ipv4 = "172.16.0.2"
endpoint_v4 = "162.159.198.2:0"
# Port zero selects 443. Use the endpoint from your existing enrollment.
# IPv6 addresses and account metadata are optional; omitted for IPv4-only use.
