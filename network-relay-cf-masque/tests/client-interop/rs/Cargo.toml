[package]
name = "client-interop-rs"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
exclude = ["../../../../network-relay-rs/Core/vendor/rustls"]
resolver = "3"

[dependencies]
network-relay-rs-core = { path = "../../../../network-relay-rs/Core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }

# Reviewed TLS 1.3 key-update correction; see the vendored PATCH.md.
[patch.crates-io]
rustls = { path = "../../../../network-relay-rs/Core/vendor/rustls" }
