[package]
name = "network-relay-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Independent Rust macOS SOCKS5 relay application"
build = "build.rs"

[workspace]
members = ["Core"]
exclude = ["Core/vendor/h3", "Core/vendor/rustls"]
resolver = "3"

[features]
default = []
# Type-check the native UI on a non-Mac development host; never run it there.
ui-typecheck = []

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
network-relay-rs-core = { path = "Core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 0

[profile.test]
debug = 0

# Reviewed TLS 1.3 key-update correction; see the vendored PATCH.md.
[patch.crates-io]
rustls = { path = "Core/vendor/rustls" }
