[package]
name = "network-relay-rs-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rust HTTP CONNECT / CONNECT-UDP and SOCKS5 client"


[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
http = "1"
h2 = "0.4.19"
h3 = { path = "vendor/h3", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sfv = "0.14.0"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
