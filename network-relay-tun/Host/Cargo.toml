[package]
name = "network-relay-tun-host"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tracing = "0.1"
thiserror = "2"
[dev-dependencies]
tracing-subscriber = "0.3"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
tun-rs = "2.8"
