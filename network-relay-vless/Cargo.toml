[package]
name = "network-relay-vless"
version = "0.1.0"
edition = "2021"
publish = false
description = "Network Relay server whose every tunnel goes through a downstream VLESS (WebSocket) proxy"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# DNS messages for the lookups carried through the proxy (no resolver or I/O).
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
# The relay itself: the server, its configuration and its helper commands.
network-relay = { path = ".." }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
tokio-util = "0.7"
# WebSocket framing only; this crate opens the TCP connection itself.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
toml = "0.9"
tracing = "0.1"

[dev-dependencies]
bytes = "1"
h3 = { git = "https://github.com/hyperium/h3", rev = "43745ad87e95b0c035ac9c547aad467303213425" }
http = "1"
rcgen = "0.14"
tokio = { version = "1", features = ["test-util", "process"] }

# network-relay's vendored h3, as network-relay itself uses it.
[patch."https://github.com/hyperium/h3"]
h3 = { path = "../vendor/h3" }
h3-quinn = { path = "../vendor/h3-quinn" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Reviewed TLS 1.3 key-update correction; see the vendored PATCH.md.
[patch.crates-io]
rustls = { path = "../vendor/rustls" }
