[package]
name = "h3-quinn"
version = "0.0.10"
rust-version = "1.74"
authors = ["Jean-Christophe BEGUE"]
edition = "2021"
documentation = "https://docs.rs/h3-quinn"
repository = "https://github.com/hyperium/h3"
readme = "README.md"
description = "QUIC transport implementation based on Quinn."
keywords = ["http3", "quic", "h3"]
categories = ["network-programming", "web-programming"]
license = "MIT"

[dependencies]
h3 = { git = "https://github.com/hyperium/h3", rev = "43745ad87e95b0c035ac9c547aad467303213425" }
bytes = "1"
quinn = { version = "0.11.7", default-features = false, features = [
    "futures-io",
] }
futures-util = { version = "0.3.28", default-features = false }
h3-datagram = {git = "https://github.com/hyperium/h3", rev = "43745ad87e95b0c035ac9c547aad467303213425", optional = true }
tracing = { version = "0.1.40", optional = true }

[features]
tracing = ["dep:tracing"]
datagram = ["dep:h3-datagram"]
